# Jupyter runs without auth for local dev only. If 8888 is reachable off this
# machine, override the command and set ServerApp.token (and password).
services:
  quantum-reservoirs:
    build:
      context: .
      dockerfile: Dockerfile
    image: quantum-reservoirs:staszek
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --ServerApp.token='' --ServerApp.password=''
      --ServerApp.allow_origin='*'
